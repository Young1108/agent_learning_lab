name: ingest-concepts

on:
  schedule:
    - cron: "0 8 * * *" # 每天 08:00 UTC（16:00 北京时间）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run ingest (fetch frontier sources)
        id: ingest
        run: node scripts/ingest.mjs

      - name: Commit concept data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/concepts.json
          git diff --cached --quiet && echo "no-data-change" || git commit -m "ingest: refresh frontier concepts (auto)"
          git pull --rebase origin main
          git push origin main

      - name: Build site
        run: |
          node_modules/.bin/vinext build
          node_modules/.bin/vinext start -p 4173 > /tmp/vinext.log 2>&1 &
          sleep 5
          curl -sf http://localhost:4173/ -o dist/client/index.html || true
          curl -sf http://localhost:4173/concepts -o dist/client/concepts.html || true
          pkill -f "vinext start" || true

      - name: Deploy to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cd /tmp/gh-pages
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -R "$GITHUB_WORKSPACE/dist/client/"* .
          echo "yang1108.ryzedns.org" > CNAME
          git add -A
          if git diff --cached --quiet; then echo "no-deploy-change"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "deploy: concepts archive refresh (auto)"
          git branch -f gh-pages HEAD
          git push origin gh-pages
